<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting | Contact Us</title>
    <meta name="description"
        content="White Water Rafting Co. delivers thrilling river adventures, promoting safety, teamwork, and a vision to inspire outdoor passion and environmental care.">
    <meta name="author" content="Mark John">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="images/logo.jpg" alt="Logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="container">
            <h1>White Water Rafting Company</h1>
            <p class="contact-info">
                123 Main River Street <br>
                Kolob, California <br>
                +1 999 999 9999 <br>
                info@whitewater.com
            </p>

            <div class="content-wrapper">

                <!-- Map Placeholder -->
                <div class="map-box">
                    <div class="map-placeholder">
                        <iframe class="iframe"
                            src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3232657.556080127!2d-119.36289798363799!3d37.69873196271808!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1764266555371!5m2!1sen!2sng"
                            width="600" height="450" allowfullscreen="" loading="lazy"
                            referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>
                </div>
                <!-- Contact Form -->
                <form class="contact-form">
                    <!-- Name -->
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>

                    <!-- Email -->
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>

                    <!-- Message Purpose -->
                    <fieldset>
                        <legend>Message Purpose</legend>

                        <label for="purpose-general">
                            <input type="radio" id="purpose-general" name="purpose" value="general" checked>
                            General Inquiry
                        </label>

                        <label for="purpose-reservation">
                            <input type="radio" id="purpose-reservation" name="purpose" value="reservation">
                            Reservation Question
                        </label>

                        <label for="purpose-website">
                            <input type="radio" id="purpose-website" name="purpose" value="website">
                            Website Suggestion
                        </label>
                    </fieldset>

                    <!-- Message -->
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Type your message here..."
                        required></textarea>

                    <!-- Newsletter Checkbox -->
                    <label class="checkbox" for="subscribe">
                        <input type="checkbox" id="subscribe" name="subscribe" value="yes">
                        Subscribe me to the monthly newsletter
                    </label>

                    <!-- Submit button -->
                    <button type="submit">Get in Touch!</button>
                </form>


            </div>
        </div>
        <div class="team-section">
            <h2>We Are Here to Serve You</h2>

            <div class="profile-container">

                <div class="profile-card">
                    <div class="profile-img">
                        <img src="images/team1.jpg" alt="Employee Photo">
                    </div>
                    <p>Employee Profile</p>
                </div>

                <div class="profile-card">
                    <div class="profile-img">
                        <img src="images/team2.jpg" alt="Employee Photo">
                    </div>
                    <p>Employee Profile</p>
                </div>

                <div class="profile-card">
                    <div class="profile-img">
                        <img src="images/team3.jpg" alt="Employee Photo">
                    </div>
                    <p>Employee Profile</p>
                </div>
            </div>

        </div>
    </main>
    <footer>
        <p>
            &copy; 2025 White Water Rafting | Mark John </p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
        </nav>

    </footer>
</body>

</html>
